[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spluspy"
version = "2.2.13"
description = "Asynchronous Python library for Soroush Plus self-bot and official bot APIs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "SPlusPy contributors"}]
keywords = ["soroush-plus", "soroush", "bot", "asyncio", "selfbot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiohttp>=3.9.0",
  "pyaes>=1.6.1",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.28.0"]
redis = ["redis>=5.0.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.4", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spluspy*"]

[tool.setuptools.package-data]
spluspy = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
