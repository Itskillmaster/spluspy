[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spluspy"
version = "2.2.7"
description = "High-performance Python Self-Bot Framework for Soroush Plus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "Ali Mirshekari"}
]
keywords = ["spluspy", "selfbot", "soroush", "plus", "soroush_plus"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "rsa",
    "pyaes",
]

[project.urls]
Homepage = "https://github.com/Itskillmaster/spluspy"
Repository = "https://github.com/Itskillmaster/spluspy"

[tool.setuptools.packages.find]
include = ["spluspy*"]
